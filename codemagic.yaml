workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60

    environment:
      node: 20
      java: 17

    scripts:
      # Step 0: Ensure gradlew is executable
      - name: Fix gradlew permissions
        script: |
          chmod +x android/gradlew

      # Step 1: Clean Gradle cache (optional but safe)
      - name: Clean Gradle cache
        script: |
          rm -rf $HOME/.gradle/caches/
          mkdir -p $HOME/.gradle/caches/

      # Step 2: Install Node dependencies
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      # Step 3: Build web app
      # Make sure this succeeds locally before CI
      - name: Build web app
        script: |
          npm run build

      # Step 4: Sync Capacitor Android
      - name: Sync Capacitor
        script: |
          npx cap sync android

      # Step 5: Build Android APK (FIXED)
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon -Djava.io.tmpdir=/tmp

    artifacts:
      - android/app/build/outputs/**/*.apk
